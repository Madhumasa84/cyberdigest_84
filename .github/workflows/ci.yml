name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

env:
  # Avoid UnicodeEncodeError on Windows consoles (✔ ✘ in healthcheck output)
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  CYBERDIGEST_HEADLESS: "1"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff) — Ubuntu only
        if: runner.os == 'Linux'
        run: |
          ruff check .
          ruff format --check .

      # Full coverage gate only on Linux (platform-specific branches differ by OS)
      - name: Unit + integration tests (with coverage gate)
        if: runner.os == 'Linux'
        run: pytest -q --cov=cyberdigest --cov-report=term-missing --cov-fail-under=80

      - name: Unit + integration tests (portability)
        if: runner.os != 'Linux'
        run: pytest -q --tb=short

      - name: Compile package
        run: python -m compileall -q src/cyberdigest news_agent.py

      - name: CLI smoke
        shell: bash
        run: |
          python news_agent.py --version
          python news_agent.py --help >/dev/null
          python -m cyberdigest --version

  security:
    name: security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  package:
    name: package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/cyberdigest-wheel-smoke
          /tmp/cyberdigest-wheel-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cyberdigest-wheel-smoke/bin/cyberdigest --version

  container:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build --tag cyberdigest:ci .
